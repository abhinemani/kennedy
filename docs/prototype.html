<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canvass prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F1F4F2; --surface:#FFFFFF; --ink:#16272B; --muted:#5B6B6E; --line:#D5DDD9;
  --primary:#1F6F5C; --primary-ink:#FFFFFF; --tint:#E2EEEA; --mark:#C47F00; --peer:#8AA39C;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10191B; --surface:#182527; --ink:#E6EEEB; --muted:#9DB0AD; --line:#2A3A3C;
    --primary:#4FB99F; --primary-ink:#0C1A17; --tint:#1D3531; --mark:#F0B429; --peer:#5F7A74;
  }
}
:root[data-theme="dark"]{
  --ground:#10191B; --surface:#182527; --ink:#E6EEEB; --muted:#9DB0AD; --line:#2A3A3C;
  --primary:#4FB99F; --primary-ink:#0C1A17; --tint:#1D3531; --mark:#F0B429; --peer:#5F7A74;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 64px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.name{font-weight:700;font-size:20px;letter-spacing:-.01em}
.name small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.switch{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--tint);border-radius:999px;padding:4px;margin-bottom:24px}
.switch button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--ink);padding:10px 8px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(10,30,25,.18)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
h1{font-size:26px;line-height:1.15;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:32px 0 6px}
.sub{color:var(--muted);margin:0 0 8px;font-size:14.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.funnel{list-style:none;margin:0;padding:0}
.funnel li{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.funnel .bar{height:10px;border-radius:5px;background:var(--primary);min-width:4px}
.funnel .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:14.5px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted)}
tr:last-child td{border-bottom:0}
.low{color:var(--mark);font-weight:700}
.btn{font:inherit;font-weight:500;border:0;border-radius:10px;padding:12px 16px;background:var(--primary);color:var(--primary-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;justify-content:space-between;gap:12px}
.rows li:last-child{border-bottom:0}
.rows .when{color:var(--muted);white-space:nowrap}
.theme{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;margin:9px 0;font-size:14.5px}
.theme .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--tint)}
.theme .fill{height:6px;border-radius:3px;background:var(--peer)}
.theme .n{text-align:right;color:var(--muted)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500}
pre{margin:10px 0 0;padding:12px;background:var(--tint);border-radius:10px;font-size:12.5px;overflow-x:auto;line-height:1.4}
/* set up */
.lists{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{font:inherit;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.list[aria-pressed="true"]{border-color:var(--primary);background:var(--tint)}
.list b{font-weight:500;font-size:14.5px;line-height:1.25}
.list span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--tint);font-weight:500}
.tally{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;background:var(--ink);color:var(--ground);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tally .big{font-size:24px}.tally small{display:block;opacity:.75;font-size:13px}
.tally .btn{background:var(--ground);color:var(--ink);white-space:nowrap}
.rung{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.rung:last-child{border-bottom:0}
.rung input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary)}
.rung b{font-weight:500}.rung p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.rung em{font-style:normal;font-size:13px;color:var(--mark);font-weight:500}
.src{font-size:12.5px;color:var(--muted);margin-top:8px}
/* interview */
.chat{display:grid;gap:10px;margin:6px 0 14px}
.msg{padding:11px 13px;border-radius:12px;max-width:88%;font-size:15.5px}
.msg.ai{background:var(--tint);justify-self:start;font-family:var(--read);font-size:17.5px;line-height:1.35}
.msg.me{background:var(--primary);color:var(--primary-ink);justify-self:end}
/* respondent */
.letter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
.progress{height:4px;background:var(--tint);border-radius:2px;margin-bottom:22px}
.progress i{display:block;height:4px;border-radius:2px;background:var(--primary);transition:width .25s}
.q{font-family:var(--read);font-size:23px;line-height:1.28;margin:0 0 8px;font-weight:500}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.opts{display:grid;gap:8px;margin:14px 0 0}
.opt{font:inherit;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--tint);font-weight:500}
input[type=number],input[type=email],textarea{font:inherit;width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:120px;resize:vertical;font-family:var(--read);font-size:18px;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--primary);margin-top:18px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.scale .opt{text-align:center;padding:14px 0}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.probe{border-left:3px solid var(--mark);padding-left:12px;margin-bottom:14px;color:var(--muted);font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15.5px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary)}
svg text{font-family:var(--ui)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.flag{font-size:13px;color:var(--muted);margin-top:28px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="name">Canvass<small>working name, sample data</small></div></header>
  <div class="switch" role="group" aria-label="Choose a view">
    <button id="tab-setup" aria-pressed="true">Set up</button>
    <button id="tab-run" aria-pressed="false">Run</button>
    <button id="tab-take" aria-pressed="false">Respond</button>
  </div>
  <main id="view"></main>
  <p class="flag">Everything here is invented for the prototype, including counts, peers, and the follow-up question, which is scripted rather than generated.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const Q = [
  {id:'role', type:'choice', text:'Which best describes your part in handling public records requests?', options:['I process them myself','I supervise the people who do','I advise on them (legal, IT)','I am not involved']},
  {id:'volume', type:'number', text:'About how many public records requests did your office receive last year?', hint:'A rough count is fine.'},
  {id:'hours', type:'choice', text:'How much staff time does a typical request take, start to finish?', options:['Under 1 hour','1 to 3 hours','3 to 8 hours','More than a day']},
  {id:'repeats', type:'slider', text:'What share of requests ask for something you have already released before?'},
  {id:'tool', type:'choice', text:'What do you use to track requests today?', options:['Email and spreadsheets','GovQA','NextRequest','JustFOIA','Something else']},
  {id:'story', type:'open', text:'Think of the last request that went badly. What happened?', hint:'Optional. A few sentences is plenty. Your words stay anonymous unless you tell us otherwise.'},
  {id:'probe', type:'probe'},
  {id:'ai', type:'scale', text:'How comfortable would you be with software drafting a response, if a named staff member reviews and approves every release?'}
];
const PEERS = [9,12,14,15,17,18,19,20,21,22,22,23,24,24,25,25,25,26,27,27,28,29,30,31,33,34,36,38,41,45,52];
const token = {role:"clerk's office", state:'Washington', pop:42000};
const LISTS = [
  ['clerk','Clerks',19840,'pa'],['manager','City and county managers',11260,'pa'],['mayor','Mayors and top elected officials',18910,'pa'],
  ['council','Council and board members',96400,'pa'],['it','Heads of IT',8730,'pa'],['finance','Heads of finance',17350,'pa'],
  ['purchasing','Heads of purchasing',6120,'pa'],['public_works','Heads of public works',16480,'pa'],['police','Police chiefs',13990,'pa'],
  ['fire','Fire chiefs',14270,'pa'],['buildings','Heads of buildings and permitting',12050,'pa'],['communications','Heads of communications',3380,'pa'],
  ['hr','Heads of HR',9640,'pa'],
  ['records_officer','Public records officers',2310,'State directories'],['attorney','City and county attorneys',1480,'Bar listings'],['foia_inbox','Agency records inboxes',4120,'MuckRock']
];
const BANDS = [['under_10k','Under 10,000',.52],['10k_50k','10,000 to 50,000',.33],['50k_250k','50,000 to 250,000',.12],['over_250k','Over 250,000',.03]];
const SETUP = {lists:new Set(['clerk','records_officer']), bands:new Set(BANDS.map(b=>b[0])), smart:true, interview:true, live:false};
const S = {
  view:'setup', step:-1, join:true, chat:null, a:{repeats:30}, touch2:false, report:true, pilot:false, email:'',
  funnel:{sampled:6400, delivered:6120, opened:612, completed:214, pilots:37},
  strata:[['Under 10,000',2600,61],['10,000 to 50,000',2400,98],['50,000 to 250,000',1100,44],['Over 250,000',300,11]],
  raisers:[['Records manager, Oregon county of 210,000','2 hours ago'],['City clerk, Ohio city of 18,000','Yesterday'],['IT director, Texas city of 96,000','Yesterday']],
  themes:[['Video and body camera redaction',58],['Searching staff email',47],['The same commercial requesters, repeatedly',41],['Deadlines missed during staff turnover',29],['Fear of being sued over a mistake',22]]
};
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('en-US');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600);}

function renderSetup(){
  const share=[...SETUP.bands].reduce((t,k)=>t+BANDS.find(b=>b[0]===k)[2],0);
  const total=Math.round([...SETUP.lists].reduce((t,k)=>t+LISTS.find(l=>l[0]===k)[2],0)*share);
  const recent=Math.round(total*0.006), bad=Math.round(total*0.041), reach=Math.max(0,total-recent-bad);
  const completes=Math.round(Math.min(reach,6400)*0.034), talks=SETUP.interview?Math.min(40,Math.round(completes*0.18)):0;
  const card=l=>`<button class="list" data-list="${l[0]}" aria-pressed="${SETUP.lists.has(l[0])}"><b>${l[1]}</b><span>${fmt(l[2])} contacts${l[3]==='pa'?'':', '+l[3]}</span></button>`;
  $('#view').innerHTML=`
  <h1>New study</h1>
  <p class="sub">Two choices shape everything else: who you are asking, and how they can answer.</p>

  <h2>Who are you asking?</h2>
  <p class="sub">Your Power Almanac lists, one per role. Pick as many as the study needs.</p>
  <div class="lists">${LISTS.filter(l=>l[3]==='pa').map(card).join('')}</div>
  <p class="src">Licensed to you only. These contacts are never shared with a sponsor or mixed into a client's study.</p>

  <h2>Lists from other sources</h2>
  <p class="sub">The people Power Almanac does not cover, gathered from public directories.</p>
  <div class="lists">${LISTS.filter(l=>l[3]!=='pa').map(card).join('')}</div>

  <h2>Narrow by size</h2>
  <div class="chips">${BANDS.map(b=>`<button class="chip" data-band="${b[0]}" aria-pressed="${SETUP.bands.has(b[0])}">${b[1]}</button>`).join('')}</div>
  <p class="src">The real screen also narrows by state, government type, and budget.</p>

  <h2>How can they answer?</h2>
  <p class="sub">Each step down reaches fewer people and learns more from each. Everyone starts with the same five closed questions, so the numbers stay comparable.</p>
  <div class="panel">
    <div class="rung"><input type="checkbox" checked disabled aria-label="Survey, always on"><div><b>Survey</b><p>Five minutes of closed questions. This is where the charts come from.</p></div></div>
    <label class="rung"><input type="checkbox" id="m-smart" ${SETUP.smart?'checked':''}><div><b>Smart survey</b> <em>add-on</em><p>One AI follow-up question after each written answer.</p></div></label>
    <label class="rung"><input type="checkbox" id="m-int" ${SETUP.interview?'checked':''}><div><b>AI interview</b> <em>add-on</em><p>A ten-minute conversation offered to the most interesting respondents, up to 40.</p></div></label>
    <label class="rung"><input type="checkbox" id="m-live" ${SETUP.live?'checked':''}><div><b>Live conversation</b><p>A link to book time with you, offered at the end.</p></div></label>
  </div>

  <p class="note">Of ${fmt(total)} contacts, ${fmt(bad)} have bad addresses and ${fmt(recent)} were asked recently, so they are left out. A sample of ${fmt(Math.min(reach,6400))} should bring about ${fmt(completes)} surveys${talks?` and ${talks} interviews`:''}.</p>
  <div class="tally"><div><span class="big">${fmt(reach)}</span><small>people you can reach</small></div><button class="btn" id="create" ${reach?'':'disabled'}>Create study</button></div>`;
  $('#view').querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>{const k=b.dataset.list;SETUP.lists.has(k)?SETUP.lists.delete(k):SETUP.lists.add(k);const y=window.scrollY;renderSetup();window.scrollTo(0,y);});
  $('#view').querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{const k=b.dataset.band;SETUP.bands.has(k)?SETUP.bands.delete(k):SETUP.bands.add(k);const y=window.scrollY;renderSetup();window.scrollTo(0,y);});
  $('#m-smart').onchange=e=>{SETUP.smart=e.target.checked;};
  $('#m-int').onchange=e=>{SETUP.interview=e.target.checked;const y=window.scrollY;renderSetup();window.scrollTo(0,y);};
  $('#m-live').onchange=e=>{SETUP.live=e.target.checked;};
  $('#create').onclick=()=>{toast('Study created from the public records template');setView('run');};
}

function renderRun(){
  const f=S.funnel, steps=[['Sampled',f.sampled],['Delivered',f.delivered],['Opened the link',f.opened],['Completed',f.completed],['Asked for a pilot',f.pilots]];
  const left=f.delivered-f.completed-38;
  const totalS=S.strata.reduce((t,r)=>t+r[1],0), totalC=S.strata.reduce((t,r)=>t+r[2],0);
  $('#view').innerHTML=`
  <h1>Public records workload</h1>
  <p class="sub">Fall 2026, wave 1, question set version 3. One study among several that share the same government registry.</p>

  <h2>Where the sample stands</h2>
  <div class="panel"><ul class="funnel">${steps.map(([l,n])=>`<li><span>${l}</span><span><span class="bar" style="display:block;width:${Math.max(1.5,n/f.sampled*100)}%"></span></span><span class="n">${fmt(n)}</span></li>`).join('')}</ul>
  <p class="note">Completion is ${(f.completed/f.delivered*100).toFixed(1)}% of delivered. At ${fmt(f.completed)} completes the margin of error is about ±${(98/Math.sqrt(f.completed)).toFixed(1)} points.</p></div>

  <h2>Coverage by population</h2>
  <p class="sub">Weights correct for who answered, so small towns do not get drowned out.</p>
  <div class="panel scroll"><table><thead><tr><th>Population</th><th>Sampled</th><th>Completed</th><th>Rate</th><th>Weight</th></tr></thead><tbody>
  ${S.strata.map(([l,s,c])=>{const rate=c/s*100,w=(s/totalS)/(c/totalC);return `<tr><td>${l}</td><td>${fmt(s)}</td><td>${c}</td><td class="${rate<2.8?'low':''}">${rate.toFixed(1)}%</td><td>${w.toFixed(2)}</td></tr>`}).join('')}
  </tbody></table></div>
  <p class="note">The highlighted band is answering less than the rest. A phone follow-up there would help more than another email.</p>

  <h2>Follow-ups</h2>
  <div class="panel">
    <ul class="rows"><li><span>First email</span><span class="when">Sent 6 days ago</span></li>
    <li><span>Second email, new subject line</span><span class="when">${S.touch2?'Queued':'Ready'}</span></li>
    <li><span>Third email, “wrong person?”</span><span class="when">In 5 days</span></li></ul>
    <p class="note">${S.touch2?`Queued for ${fmt(left)} contacts.`:`Would go to ${fmt(left)} contacts.`} Left out: ${fmt(f.completed)} who already answered, and 38 who were surveyed in another study within 90 days.</p>
    <div style="margin-top:14px"><button class="btn" id="send2" ${S.touch2?'disabled':''}>${S.touch2?'Second email queued':'Queue second email'}</button></div>
  </div>

  <h2>Asked for a pilot</h2>
  <div class="panel"><ul class="rows">${S.raisers.map(([w,t])=>`<li><span>${w}</span><span class="when">${t}</span></li>`).join('')}</ul></div>

  <h2>What people wrote</h2>
  <p class="sub">Open answers coded against the study's codebook. Counts are respondents, not mentions.</p>
  <div class="panel">${S.themes.map(([l,n])=>`<div class="theme"><span>${l}</span><span class="n">${n}</span><div class="track"><div class="fill" style="width:${n/58*100}%"></div></div></div>`).join('')}</div>

  <h2>The study file</h2>
  <p class="sub">Questions live in a versioned file. Adding one is an edit, and every answer remembers which version it saw.</p>
  <div class="panel"><details><summary>Show version 3</summary><pre>${JSON.stringify(Q.filter(q=>q.type!=='probe').map(q=>({id:q.id,type:q.type,text:q.text})),null,1).replace(/</g,'&lt;')}</pre></details></div>`;
  $('#send2').onclick=()=>{S.touch2=true;renderRun();toast('Second email queued');};
}

function probeFor(text){
  const t=text.toLowerCase();
  if(/video|body|cam|redact|footage/.test(t)) return 'You mentioned video or redaction. Roughly how long does one of those requests take today, and who does the redacting?';
  if(/email|inbox|search/.test(t)) return 'You mentioned searching email. Who runs that search, and how do you know when you have found everything?';
  if(/same|repeat|again|commercial|vendor/.test(t)) return 'It sounds like the same kind of request keeps coming back. What stops you from pointing people to the earlier release?';
  if(/sue|lawsuit|attorney|legal|deadline/.test(t)) return 'You mentioned legal pressure. What part of the process worries you most when a deadline is close?';
  return 'What would have had to be different for that request to go well?';
}
function visible(i){return !(Q[i].type==='probe' && !(S.a.story||'').trim());}
function move(dir){let i=S.step+dir;while(i>=0&&i<Q.length&&!visible(i))i+=dir;S.step=i;renderTake();window.scrollTo(0,0);}
function canGo(q){const v=S.a[q.id];if(q.type==='choice')return v!=null;if(q.type==='number')return v>0;return true;}

function strip(you){
  const W=320,max=60,x=v=>12+Math.min(v,max)/max*(W-24),med=25;
  const dots=PEERS.map((v,i)=>`<circle cx="${x(v).toFixed(1)}" cy="${38+((i*7)%3-1)*7}" r="4" fill="var(--peer)"/>`).join('');
  return `<svg viewBox="0 0 ${W} 86" width="100%" role="img" aria-label="Your office at ${you.toFixed(0)} requests per 1,000 residents, compared with a peer median of ${med}">
  <line x1="12" y1="58" x2="${W-12}" y2="58" stroke="var(--line)"/>
  <line x1="${x(med)}" y1="22" x2="${x(med)}" y2="58" stroke="var(--muted)" stroke-dasharray="3 3"/>
  <text x="${x(med)}" y="16" font-size="11" text-anchor="middle" fill="var(--muted)">peer median ${med}</text>${dots}
  <path d="M${x(you)} 60 l7 12 h-14z" fill="var(--mark)"/>
  <text x="${Math.min(Math.max(x(you),30),W-30)}" y="84" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">you, ${you.toFixed(0)}${you>max?'+':''}</text>
  <text x="12" y="70" font-size="10" fill="var(--muted)">0</text><text x="${W-12}" y="70" font-size="10" text-anchor="end" fill="var(--muted)">60 per 1,000</text></svg>`;
}

function renderTake(){
  const v=$('#view');
  if(S.step===-1){
    v.innerHTML=`<div class="letter"><p class="q">Five minutes on how your office handles public records requests.</p>
    <p class="hint">This link was prepared for the ${token.role} of a ${token.state} city of about ${fmt(token.pop)} people, so we can skip the questions we already know the answer to. When you finish, you will see how your numbers compare with cities your size.</p>
    <div class="nav"><button class="btn ghost" id="fix">That is not me</button><button class="btn" id="start">Start the survey</button></div></div>`;
    $('#start').onclick=()=>move(1);$('#fix').onclick=()=>toast('In the real tool this opens a short correction form');return;
  }
  if(S.step>=Q.length){return renderEnd();}
  const q=Q[S.step],pct=(S.step+1)/(Q.length+1)*100;let body='';
  if(q.type==='choice') body=`<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="${S.a[q.id]===i}">${o}</button>`).join('')}</div>`;
  if(q.type==='number') body=`<input type="number" inputmode="numeric" id="num" min="0" placeholder="For example, 800" value="${S.a[q.id]||''}">`;
  if(q.type==='slider') body=`<div class="big" id="sv">${S.a.repeats}%</div><input type="range" id="rng" min="0" max="100" step="5" value="${S.a.repeats}" aria-label="Share of repeat requests">`;
  if(q.type==='open'||q.type==='probe') body=`<textarea id="txt" aria-label="Your answer"></textarea>`;
  if(q.type==='scale') body=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="opt" data-i="${n}" aria-pressed="${S.a[q.id]===n}">${n}</button>`).join('')}</div><div class="ends"><span>Not at all</span><span>Very</span></div>`;
  const text=q.type==='probe'?probeFor(S.a.story):q.text;
  v.innerHTML=`<div class="letter"><div class="progress"><i style="width:${pct}%"></i></div>
  ${q.type==='probe'?'<p class="probe">One follow-up, written in response to what you just told us. Skip it if you like.</p>':''}
  <p class="q">${text}</p>${q.hint?`<p class="hint">${q.hint}</p>`:''}${body}
  <div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn" id="next" ${canGo(q)?'':'disabled'}>Continue</button></div></div>`;
  const next=$('#next');
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.a[q.id]=+b.dataset.i;renderTake();});
  if($('#num')) $('#num').oninput=e=>{S.a[q.id]=+e.target.value;next.disabled=!canGo(q);};
  if($('#rng')) $('#rng').oninput=e=>{S.a.repeats=+e.target.value;$('#sv').textContent=e.target.value+'%';};
  if($('#txt')){$('#txt').value=S.a[q.id]||'';$('#txt').oninput=e=>{S.a[q.id]=e.target.value;};}
  $('#back').onclick=()=>move(-1);next.onclick=()=>move(1);
}

function renderEnd(){
  const per=S.a.volume/token.pop*1000,hrs=[0.5,2,5,10][S.a.hours],med=25;
  const cmp=per>med*1.15?'more than most':per<med*0.85?'fewer than most':'about the same as most';
  $('#view').innerHTML=`<div class="letter"><div class="progress"><i style="width:100%"></i></div>
  <p class="q">Your office handles ${cmp} cities your size.</p>
  <p class="hint">${fmt(S.a.volume)} requests works out to about ${per.toFixed(0)} for every 1,000 residents. Each dot is a city between 25,000 and 75,000 people.</p>
  ${strip(per)}
  <p class="hint" style="margin-top:14px">At roughly ${hrs} staff ${hrs===1?'hour':'hours'} each, that is about ${fmt(Math.round(S.a.volume*hrs))} hours a year. You told us ${S.a.repeats}% repeat something already released, which is around ${fmt(Math.round(S.a.volume*hrs*S.a.repeats/100))} of those hours.</p>
  <label class="check"><input type="checkbox" id="rep" ${S.report?'checked':''}><span>Email me the full benchmark report when the study closes</span></label>
  <label class="check"><input type="checkbox" id="pil" ${S.pilot?'checked':''}><span>I would like to hear about piloting a tool that reduces this workload</span></label>
  <label class="check"><input type="checkbox" id="join" ${S.join?'checked':''}><span>Keep me in the loop with benchmarks from future studies. A few short surveys a year, and you can leave at any time.</span></label>
  <input type="email" id="em" placeholder="Work email" value="${S.email}" autocomplete="email">
  ${SETUP.interview&&(S.a.story||'').trim()?`<div class="panel" style="margin-top:16px;background:var(--tint);border:0"><b style="font-weight:500">Want to talk it through?</b><p class="note" style="margin:4px 0 12px">About ten minutes with our AI interviewer, picking up from what you wrote. Skip anything, stop any time.</p><button class="btn ghost" id="talk">Start the conversation</button></div>`:''}
  <div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn" id="fin">Record my response</button></div></div>`;
  $('#rep').onchange=e=>S.report=e.target.checked;$('#pil').onchange=e=>S.pilot=e.target.checked;$('#em').oninput=e=>S.email=e.target.value;$('#join').onchange=e=>S.join=e.target.checked;
  if($('#talk')) $('#talk').onclick=()=>{S.chat=[['ai','Walk me through that request, step by step. Who touched it first?']];renderChat();window.scrollTo(0,0);};
  $('#back').onclick=()=>move(-1);
  $('#fin').onclick=()=>{
    S.funnel.completed++;S.funnel.opened++;S.strata[1][2]++;
    if(S.pilot){S.funnel.pilots++;S.raisers.unshift([`City clerk, ${token.state} city of ${fmt(token.pop)}`,'Just now']);}
    $('#view').innerHTML=`<div class="letter"><p class="q">Response recorded. Thank you.</p><p class="hint">On the operator's side, this answer has already joined its population band, left the follow-up list${S.pilot?', and appeared under “Asked for a pilot.”':'.'}${S.join?' You have also joined the panel.':''}</p><div class="nav"><span></span><button class="btn" id="see">See it in the console</button></div></div>`;
    toast('Response recorded');S.step=-1;S.a={repeats:30};S.chat=null;
    $('#see').onclick=()=>setView('run');
  };
}

const SCRIPT=['Where did most of the time go: finding the records, redacting them, or getting sign-off?','If software had drafted that response for you to approve, what would you have checked before releasing it?'];
function renderChat(){
  const asked=S.chat.filter(m=>m[0]==='ai').length, done=asked>SCRIPT.length+1;
  $('#view').innerHTML=`<div class="letter"><p class="probe">Led by an AI interviewer working from a researcher's guide. In this prototype the questions are scripted.</p>
  <div class="chat" id="chat"></div>
  ${done?`<div class="nav"><span></span><button class="btn" id="cdone">Back to my results</button></div>`
        :`<textarea id="say" aria-label="Your reply" style="min-height:90px"></textarea><div class="nav"><button class="btn ghost" id="cstop">Stop here</button><button class="btn" id="csend">Send reply</button></div>`}</div>`;
  const box=$('#chat');S.chat.forEach(([who,t])=>{const d=document.createElement('div');d.className='msg '+(who==='ai'?'ai':'me');d.textContent=t;box.appendChild(d);});
  if(done){$('#cdone').onclick=()=>renderEnd();return;}
  $('#cstop').onclick=()=>renderEnd();
  $('#csend').onclick=()=>{const v=$('#say').value.trim();if(!v)return;S.chat.push(['me',v]);const n=S.chat.filter(m=>m[0]==='ai').length;S.chat.push(['ai',n<=SCRIPT.length?SCRIPT[n-1]:'Thank you. That covers what we hoped to learn.']);renderChat();window.scrollTo(0,document.body.scrollHeight);};
}

function setView(name){S.view=name;for(const t of ['setup','run','take'])$('#tab-'+t).setAttribute('aria-pressed',name===t);({setup:renderSetup,run:renderRun,take:renderTake})[name]();window.scrollTo(0,0);}
for(const t of ['setup','run','take'])$('#tab-'+t).onclick=()=>setView(t);
renderSetup();
</script>
</body>
</html>
